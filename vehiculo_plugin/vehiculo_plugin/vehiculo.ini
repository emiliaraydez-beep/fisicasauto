; Perfil por modelo. [Auto] vale para todos; [Auto_<id del modelo>] lo pisa. Todo es opcional (valores por defecto entre parentesis).
; Unidades: metros, kg, m/s. Las ruedas son simetricas respecto al eje del auto.
[Auto]
masa=1400            ; kg (1400)
cgY=0.08             ; centro de gravedad, + = adelante (0.08)
cgZ=-0.10            ; + = arriba; mas bajo = mas estable (-0.10)
agarre=1.05          ; friccion maxima del neumatico (1.05)
traccion=0           ; 0 trasera, 1 delantera, 2 total (0)
velMax=38            ; m/s en la ultima marcha (38 = 137 km/h)
aceleracion=9        ; m/s2 de referencia en 1a (9)
frenos=1.2           ; g de frenada (1.2)
repartoFreno=0.65    ; fraccion delantera (0.65)
frecSusp=1.4         ; Hz, 1.0 blanda .. 2.0 dura (1.4)
deposito=55          ; litros (55)
radioRueda=0.35      ; m (0.35)
medioLargo=2.3       ; (2.3)
medioAncho=0.9       ; (0.9)
ruedaX=0.85          ; mitad de la via (0.85)
ruedaYDelantera=1.4  ; (1.4)
ruedaYTrasera=-1.4   ; (-1.4)
ruedaZ=-0.3          ; (-0.3)

; Ejemplo: solo el modelo 542
;[Auto_542]
;masa=1230
;velMax=45
